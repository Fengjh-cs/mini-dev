[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-dev"
version = "0.1.0"
description = "A minimal CLI coding agent — resume project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.66", "python-dotenv>=1.0", "tree-sitter>=0.21", "tree-sitter-python>=0.21", "tree-sitter-javascript>=0.21", "tree-sitter-go>=0.21", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
mindev = "mindev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
