name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: docker pull python:3.13-slim
      - run: pytest tests/test_sandbox.py::test_docker_command_writes_only_to_isolated_copy -q
        env:
          MINIDEV_REQUIRE_DOCKER: "1"
      - run: docker build -f Dockerfile.verify -t mindev-verify:local .
      - run: pytest tests/test_verify.py::test_real_docker_verifier_uses_isolated_copy -q
        env:
          MINIDEV_REQUIRE_DOCKER: "1"
